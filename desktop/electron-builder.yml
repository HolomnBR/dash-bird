appId: com.holomn.dashbird
productName: Dash Bird
directories:
  output: release
files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "api-dist/**/*"
  - "!api-dist/**/*.pdb"
  - "!api-dist/**/*.xml"

# Configurações específicas para Windows
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  
  # Garantir que a API seja incluída no pacote
  extraResources:
    - from: "api-dist"
      to: "api-dist"
      filter: ["**/*"]
  
  # Configurações de assinatura de código (propriedades corretas para v26.0.12)
  # Configuração simplificada para melhor compatibilidade
  # As variáveis serão passadas via linha de comando ou ambiente
  # cscLink: "${env.CSC_LINK}"
  # cscKeyPassword: "${env.CSC_KEY_PASSWORD}"
  
  # Configurações alternativas (se a sintaxe acima não funcionar)
  # cscLink: "${CSC_LINK}"
  # cscKeyPassword: "${CSC_KEY_PASSWORD}"
  
  # Configurações de segurança e compatibilidade
  requestedExecutionLevel: asInvoker
  artifactName: "${productName}-${version}-${arch}.${ext}"
  
  # Ícone do aplicativo (usando o app.ico válido)
  icon: "public/app.ico"

# Configurações do instalador NSIS (robusta e funcional)
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Dash Bird"
  # Configurações de ícones usando o app.ico válido
  installerIcon: "public/app.ico"
  uninstallerIcon: "public/app.ico"
  # Removendo referências a arquivos que não existem
  # include: "build/installer.nsh"
  # script: "build/installer.nsi"

# Configurações gerais de segurança
publish:
  provider: github
  releaseType: release
  private: false

# Configurações de compressão
compression: maximum

# Configurações de metadados
extraMetadata:
  homepage: "https://github.com/HolomnBR/dash-bird"
  author:
    name: "Holomn"
    email: "contato@holomn.com.br"
  description: "Dash Bird - Desktop client for Firebird database exploration"
  keywords:
    - "firebird"
    - "database"
    - "desktop"
    - "electron"
    - "react"