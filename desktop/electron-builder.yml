appId: com.holomn.dashbird
productName: Dash Bird
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - api-dist/**
  - package.json
extraResources:
  - from: api-dist
    to: api-dist
asar: true
win:
  forceCodeSigning: false
  target:
    - nsis
    - portable
  artifactName: "Dash Bird.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

