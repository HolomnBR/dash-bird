name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm run build:api

      - name: Build Electron
        run: pnpm run build:electron

      - name: Build Windows artifacts
        run: pnpm run build:windows

      - name: List generated files
        shell: pwsh
        run: |
          Write-Host "📁 Verificando arquivos gerados..."
          Write-Host "📁 Conteúdo da pasta release:"
          
          if (Test-Path "desktop\release") {
            $files = Get-ChildItem "desktop\release" -Force
            foreach ($file in $files) {
              Write-Host "  - $($file.Name) ($($file.Length) bytes) - $($file.Extension)"
            }
            
            Write-Host "`n🔍 Arquivos por tipo:"
            $exeFiles = Get-ChildItem "desktop\release\*.exe" -ErrorAction SilentlyContinue
            $zipFiles = Get-ChildItem "desktop\release\*.zip" -ErrorAction SilentlyContinue
            $7zFiles = Get-ChildItem "desktop\release\*.7z" -ErrorAction SilentlyContinue
            
            Write-Host "Executáveis (.exe): $($exeFiles.Count) arquivos"
            Write-Host "ZIP (.zip): $($zipFiles.Count) arquivos"
            Write-Host "7z (.7z): $($7zFiles.Count) arquivos"
          } else {
            Write-Host "❌ Pasta desktop\release não encontrada!"
          }

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: DashBird Windows Build v${{ github.run_number }}
          body: |
            🚀 Build automático do DashBird para Windows
            
            **Build Number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            📦 **Artefatos incluídos:**
            - Instalador NSIS (.exe)
            - Versão portátil (.exe)
            - Arquivos compactados (.zip, .7z)
            
            ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}

      - name: Upload NSIS Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: desktop/release/DashBird-*.exe
          asset_name: DashBird-Windows-Installer-v${{ github.run_number }}.exe
          asset_content_type: application/octet-stream

      - name: Upload Portable Version
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: desktop/release/DashBird-*.exe
          asset_name: DashBird-Windows-Portable-v${{ github.run_number }}.exe
          asset_content_type: application/octet-stream

      - name: Upload ZIP Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: desktop/release/*.zip
          asset_name: DashBird-Windows-v${{ github.run_number }}.zip
          asset_content_type: application/zip

      - name: Upload 7z Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: desktop/release/*.7z
          asset_name: DashBird-Windows-v${{ github.run_number }}.7z
          asset_content_type: application/x-7z-compressed

      - name: Upload artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.7z
            desktop/release/*.nsis.exe

