name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. BUILD
      - name: Build application artifacts
        run: pnpm run build:windows
      
      # 2. VERIFY
      - name: Verify build artifacts
        run: |
          node scripts/verify-build.js
          echo "📁 Arquivos gerados em desktop/release:"
          dir release

      # 3. CREATE AND PUBLISH RELEASE
      - name: Create and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a temporary file with the release notes
          cat <<'EOF' > release-notes.md
          🚀 Build automático do DashBird para Windows

          **Build Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          📦 **Artefatos incluídos:**
          - Instalador e/ou versão portátil para Windows.
          
          ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          EOF

          # Create a new release and upload all files from the release folder in one go.
          gh release create v${{ github.run_number }} release/*.* \
            --title "DashBird Windows Build v${{ github.run_number }}" \
            --notes-file release-notes.md \
            --latest
