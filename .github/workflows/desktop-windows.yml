name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm run build:api

      - name: Build Electron
        run: pnpm run build:electron

      - name: Build Windows artifacts
        run: pnpm run build:windows

      - name: Verify build integrity
        run: pnpm run verify:build

      - name: List generated files
        shell: pwsh
        run: |
          Write-Host "📁 Verificando arquivos gerados..."
          Write-Host "📁 Conteúdo da pasta release:"
          
          if (Test-Path "release") {
            $files = Get-ChildItem "release" -Force
            foreach ($file in $files) {
              Write-Host "  - $($file.Name) ($($file.Length) bytes) - $($file.Extension)"
            }
            
            # Verificar pasta win-unpacked
            if (Test-Path "release\win-unpacked") {
              Write-Host "`n📁 Conteúdo da pasta win-unpacked:"
              $winUnpackedFiles = Get-ChildItem "release\win-unpacked" -Force
              foreach ($file in $winUnpackedFiles) {
                Write-Host "  - $($file.Name) ($($file.Length) bytes) - $($file.Extension)"
              }
            }
            
            Write-Host "`n🔍 Arquivos por tipo:"
            $exeFiles = Get-ChildItem "release\win-unpacked\*.exe" -ErrorAction SilentlyContinue
            $dllFiles = Get-ChildItem "release\win-unpacked\*.dll" -ErrorAction SilentlyContinue
            
            Write-Host "Executáveis (.exe): $($exeFiles.Count) arquivos"
            Write-Host "Bibliotecas (.dll): $($dllFiles.Count) arquivos"
            
            # Nota sobre arquivos empacotados
            Write-Host "`nℹ️  Nota: O electron-builder está gerando apenas o executável desempacotado"
            Write-Host "   devido ao code signing. Os arquivos .exe, .zip e .7z empacotados"
            Write-Host "   não estão sendo gerados neste momento."
            
            # Salvar nomes dos arquivos para uso posterior
            if ($exeFiles.Count -gt 0) {
              $exeFile = $exeFiles[0].Name
              echo "EXE_FILE_NAME=$exeFile" >> $env:GITHUB_ENV
              Write-Host "📦 Arquivo .exe principal: $exeFile"
            }
          } else {
            Write-Host "❌ Pasta release não encontrada!"
            exit 1
          }

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: DashBird Windows Build v${{ github.run_number }}
          body: |
            🚀 Build automático do DashBird para Windows
            
            **Build Number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            📦 **Artefatos incluídos:**
            - Executável principal (.exe)
            - Versão portátil (.exe)
            
            ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

      - name: Verify files before upload
        shell: pwsh
        run: |
          Write-Host "🔍 Verificando arquivos antes do upload..."
          
          $exePath = "release\win-unpacked\$env:EXE_FILE_NAME"
          
          if (-not (Test-Path $exePath)) {
            Write-Host "❌ Arquivo .exe não encontrado: $exePath"
            exit 1
          }
          
          Write-Host "✅ Arquivo .exe encontrado: $exePath"
          
          # Verificar se o executável tem tamanho adequado (mais de 100MB)
          $fileSize = (Get-Item $exePath).Length
          $fileSizeMB = [math]::Round($fileSize / 1MB, 2)
          Write-Host "📦 Tamanho do executável: $fileSizeMB MB"
          
          if ($fileSize -lt 100MB) {
            Write-Host "⚠️  Executável parece muito pequeno, pode estar corrompido"
          }

      - name: Upload NSIS Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/win-unpacked/${{ env.EXE_FILE_NAME }}
          asset_name: DashBird-Windows-Installer-v${{ github.run_number }}.exe
          asset_content_type: application/octet-stream

      - name: Upload Portable Version
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/win-unpacked/${{ env.EXE_FILE_NAME }}
          asset_name: DashBird-Windows-Portable-v${{ github.run_number }}.exe
          asset_content_type: application/octet-stream



      - name: Upload artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            release/win-unpacked/*.exe

