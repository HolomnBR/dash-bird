name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. BUILD
      - name: Build app
        run: pnpm run build:windows
      
      - name: Verify build artifacts
        run: node scripts/verify-build.js

      - name: List generated files for debug
        run: |
          echo "📁 Arquivos gerados em desktop/release:"
          dir release

      # 2. CREATE RELEASE
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: DashBird Windows Build v${{ github.run_number }}
          body: |
            🚀 Build automático do DashBird para Windows
            
            **Build Number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            📦 **Artefatos incluídos:**
            - Instalador e/ou versão portátil para Windows.
            
            ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

      # 3. UPLOAD ARTIFACTS
      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # O working-directory aqui é 'desktop', então os caminhos são relativos a ele.
          # A action 'upload-release-asset' não é usada aqui, fazemos o upload via API para ter mais controle.
          $headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/vnd.github.v3+json"
          }
          
          Get-ChildItem "release" -File | Where-Object { $_.Extension -in ".exe", ".zip", ".7z", ".blockmap" } | ForEach-Object {
            $assetPath = $_.FullName
            $assetName = $_.Name
            $uploadUrl = "${{ steps.create_release.outputs.upload_url }}?name=$assetName"
            Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile $assetPath -ContentType "application/octet-stream"
            Write-Host "✅ Uploaded $assetName"
          }
