name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm run build:api

      - name: Build Electron
        run: pnpm run build:electron

      - name: Build Windows artifacts
        run: pnpm run build:windows

      - name: Consolidar artefatos usando script
        run: node scripts/consolidate-build.js

      - name: Verify build integrity
        run: pnpm run verify:build

      - name: List generated files
        shell: pwsh
        run: |
          Write-Host "📁 Verificando arquivos gerados em release..."
          
          if (Test-Path "release") {
            $files = Get-ChildItem "release" -Force
            Write-Host "📁 Conteúdo da pasta release:"
            foreach ($file in $files) {
              if ($file.PSIsContainer) {
                Write-Host "  📁 $($file.Name)/ (diretório)"
              } else {
                Write-Host "  📄 $($file.Name) ($($file.Length) bytes) - $($file.Extension)"
              }
            }
            
            # Verificar subpastas importantes
            $subdirs = @("api-dist", "dist", "dist-electron", "win-unpacked")
            foreach ($subdir in $subdirs) {
              $subdirPath = "release\$subdir"
              if (Test-Path $subdirPath) {
                Write-Host "`n📁 Conteúdo de $($subdir):"
                $subdirFiles = Get-ChildItem $subdirPath -Force
                foreach ($file in $subdirFiles) {
                  if ($file.PSIsContainer) {
                    Write-Host "  📁 $($file.Name)/ (diretório)"
                  } else {
                    Write-Host "  📄 $($file.Name) ($($file.Length) bytes) - $($file.Extension)"
                  }
                }
              }
            }
            
            Write-Host "`n🔍 Arquivos por tipo:"
            $exeFiles = Get-ChildItem "release\*.exe" -ErrorAction SilentlyContinue
            $dllFiles = Get-ChildItem "release\*.dll" -ErrorAction SilentlyContinue
            $apiFiles = Get-ChildItem "release\FirebirdApi.*" -ErrorAction SilentlyContinue
            
            Write-Host "Executáveis (.exe): $($exeFiles.Count) arquivos"
            $exeFiles | ForEach-Object { Write-Host "   - $($_.Name)" }
            
            Write-Host "Bibliotecas (.dll): $($dllFiles.Count) arquivos"
            $dllFiles | ForEach-Object { Write-Host "   - $($_.Name)" }
            
            Write-Host "Arquivos da API: $($apiFiles.Count) arquivos"
            $apiFiles | ForEach-Object { Write-Host "   - $($_.Name)" }
            
            # Salvar nomes dos arquivos para uso posterior
            if ($exeFiles.Count -gt 0) {
              $exeFile = $exeFiles[0].Name
              echo "EXE_FILE_NAME=$exeFile" >> $env:GITHUB_ENV
              Write-Host "📦 Arquivo .exe principal: $exeFile"
            }
            
            # Verificar especificamente o Dash Bird.exe
            Write-Host "🔍 Procurando por executáveis Dash Bird..."
            
            # Procurar por todos os arquivos .exe na pasta release
            $allExeFiles = Get-ChildItem "release\*.exe" -ErrorAction SilentlyContinue
            $dashBirdExe = $null
            
            foreach ($exeFile in $allExeFiles) {
              Write-Host "  📄 Encontrado: $($exeFile.Name)"
              if ($exeFile.Name -like "*Dash Bird*") {
                $dashBirdExe = $exeFile.FullName
                Write-Host "✅ Dash Bird.exe encontrado: $($exeFile.Name)"
                # IMPORTANTE: Como working-directory é 'desktop', o caminho deve ser 'release/Dash Bird.exe'
                $relativePath = "release\$($exeFile.Name)"
                echo "UPLOAD_EXE_PATH=$relativePath" >> $env:GITHUB_ENV
                Write-Host "✅ Variável UPLOAD_EXE_PATH definida: $relativePath"
                break
              }
            }
            
            if (-not $dashBirdExe) {
              Write-Host "⚠️  Dash Bird.exe não encontrado na pasta release"
              
              # Verificar se está em win-unpacked
              $winUnpackedExe = "release\win-unpacked\Dash Bird.exe"
              if (Test-Path $winUnpackedExe) {
                $stats = Get-Item $winUnpackedExe
                Write-Host "✅ Dash Bird.exe encontrado em win-unpacked: $($stats.Length) bytes"
                # IMPORTANTE: Como working-directory é 'desktop', o caminho deve ser 'release/win-unpacked/Dash Bird.exe'
                echo "UPLOAD_EXE_PATH=release\win-unpacked\Dash Bird.exe" >> $env:GITHUB_ENV
                Write-Host "✅ Variável UPLOAD_EXE_PATH definida: release\win-unpacked\Dash Bird.exe"
              } else {
                Write-Host "❌ Dash Bird.exe não encontrado em lugar nenhum!"
                
                # Listar todos os arquivos .exe para debug
                Write-Host "🔍 Listando todos os arquivos .exe encontrados:"
                Get-ChildItem "release" -Recurse -Filter "*.exe" | ForEach-Object {
                  Write-Host "  📄 $($_.FullName)"
                }
              }
            }
            
            # Debug: mostrar o valor final da variável
            Write-Host "🔍 Valor final de UPLOAD_EXE_PATH: $env:UPLOAD_EXE_PATH"
          } else {
            Write-Host "❌ Pasta release não encontrada!"
            exit 1
          }

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: DashBird Windows Build v${{ github.run_number }}
          body: |
            🚀 Build automático do DashBird para Windows
            
            **Build Number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            📦 **Artefatos incluídos:**
            - Executável principal (.exe)
            - Versão portátil (.exe)
            
            ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

      - name: Verify files before upload
        shell: pwsh
        run: |
          Write-Host "🔍 Verificando arquivos antes do upload..."
          Write-Host "📁 Diretório atual: $(Get-Location)"
          
          # Debug: mostrar todas as variáveis de ambiente
          Write-Host "🔍 Variáveis de ambiente disponíveis:"
          Write-Host "UPLOAD_EXE_PATH: $env:UPLOAD_EXE_PATH"
          Write-Host "DASH_BIRD_EXE_PATH: $env:DASH_BIRD_EXE_PATH"
          
          # Verificar se temos o caminho do Dash Bird.exe
          if (-not $env:UPLOAD_EXE_PATH) {
            Write-Host "❌ Caminho do Dash Bird.exe não definido!"
            Write-Host "🔍 Tentando usar DASH_BIRD_EXE_PATH como fallback..."
            if ($env:DASH_BIRD_EXE_PATH) {
              $env:UPLOAD_EXE_PATH = $env:DASH_BIRD_EXE_PATH
              Write-Host "✅ Usando DASH_BIRD_EXE_PATH como fallback: $env:UPLOAD_EXE_PATH"
            } else {
              Write-Host "❌ Nenhuma variável de caminho definida!"
              exit 1
            }
          }
          
          $exePath = $env:UPLOAD_EXE_PATH
          Write-Host "📁 Caminho do executável: $exePath"
          
          # IMPORTANTE: Verificar se o arquivo existe
          if (-not (Test-Path $exePath)) {
            Write-Host "❌ Arquivo .exe não encontrado: $exePath"
            Write-Host "🔍 Listando arquivos no diretório atual:"
            Get-ChildItem | ForEach-Object { Write-Host "  - $($_.Name)" }
            
            # Tentar encontrar o arquivo em outros locais
            Write-Host "🔍 Tentando encontrar Dash Bird.exe em outros locais..."
            if (Test-Path "release\Dash Bird.exe") {
              Write-Host "✅ Dash Bird.exe encontrado em release\Dash Bird.exe"
              $env:UPLOAD_EXE_PATH = "release\Dash Bird.exe"
              $exePath = $env:UPLOAD_EXE_PATH
            } elseif (Test-Path "release\win-unpacked\Dash Bird.exe") {
              Write-Host "✅ Dash Bird.exe encontrado em release\win-unpacked\Dash Bird.exe"
              $env:UPLOAD_EXE_PATH = "release\win-unpacked\Dash Bird.exe"
              $exePath = $env:UPLOAD_EXE_PATH
            } else {
              Write-Host "❌ Dash Bird.exe não encontrado em lugar nenhum!"
              exit 1
            }
          }
          
          Write-Host "✅ Arquivo .exe encontrado: $exePath"
          
          # Verificar se o executável tem tamanho adequado (mais de 100MB)
          $fileSize = (Get-Item $exePath).Length
          $fileSizeMB = [math]::Round($fileSize / 1MB, 2)
          Write-Host "📦 Tamanho do executável: $fileSizeMB MB"
          
          if ($fileSize -lt 100MB) {
            Write-Host "⚠️  Executável parece muito pequeno, pode estar corrompido"
          }
          
          # Verificar se os arquivos da API estão presentes
          $apiExe = "api-dist\FirebirdApi.exe"
          if (Test-Path $apiExe) {
            Write-Host "✅ Arquivo da API encontrado: $apiExe"
          } else {
            Write-Host "⚠️  Arquivo da API não encontrado: $apiExe"
          }
          
          Write-Host "✅ Verificação concluída com sucesso!"
          Write-Host "🎯 Caminho final para upload: $env:UPLOAD_EXE_PATH"

      - name: Upload DashBird Executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.UPLOAD_EXE_PATH }}
          asset_name: DashBird-Windows-v${{ github.run_number }}.exe
          asset_content_type: application/octet-stream

