name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. BUILD COM ASSINATURA DIGITAL
      - name: Build application artifacts with code signing
        env:
          # Secrets necessários para assinatura de código
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_KEY_SHA1: ${{ secrets.CSC_KEY_SHA1 }}
          
          # Variáveis de ambiente para build
          NODE_ENV: production
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        shell: pwsh
        run: |
          Write-Host "🔐 Iniciando build com assinatura digital..." -ForegroundColor Green
          
          # Verificar se temos as variáveis necessárias
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            Write-Host "📋 Variáveis de ambiente configuradas:" -ForegroundColor Green
            Write-Host "CSC_LINK: $env:CSC_LINK" -ForegroundColor Cyan
            Write-Host "CSC_KEY_PASSWORD: [CONFIGURADO]" -ForegroundColor Cyan
            
            # Configurar assinatura de código usando o script especializado
            Write-Host "🔐 Configurando certificado de assinatura..." -ForegroundColor Yellow
            & "..\scripts\setup-code-signing.ps1" -CertificateBase64 $env:CSC_LINK -CertificatePassword $env:CSC_KEY_PASSWORD -WorkingDirectory "."
            
            # Executar o build com assinatura usando o novo script
            Write-Host "🚀 Iniciando build com assinatura digital..." -ForegroundColor Green
            pnpm run build:windows:signed
          } else {
            Write-Host "⚠️  Certificado não configurado. O build prosseguirá sem assinatura digital." -ForegroundColor Yellow
            
            # Executar o build sem assinatura
            Write-Host "🚀 Iniciando build sem assinatura digital..." -ForegroundColor Green
            pnpm run build:windows
          }
          
          Write-Host "✅ Build concluído com sucesso!" -ForegroundColor Green
      
      # 2. VERIFICAÇÃO DOS ARQUIVOS GERADOS
      - name: Verify build artifacts and code signing
        shell: pwsh
        run: |
          Write-Host "🔍 Verificando arquivos gerados..." -ForegroundColor Yellow
          node scripts/verify-build.js
          
          Write-Host "📁 Arquivos gerados em desktop/release:" -ForegroundColor Cyan
          Get-ChildItem release
          
          Write-Host "🔐 Verificando assinatura digital..." -ForegroundColor Yellow
          # Usar script robusto que não falha o workflow
          node scripts/verify-signature-robust.js
          
          Write-Host "✅ Verificação de assinatura concluída" -ForegroundColor Green

      # 3. CRIAÇÃO E PUBLICAÇÃO DO RELEASE
      - name: Create and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Criar arquivo de notas do release
          @"
          🚀 Build automático do DashBird para Windows

          **Build Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          📦 **Artefatos incluídos:**
          - Instalador NSIS para Windows x64
          - Versão portátil para Windows x64
          - Aplicativo assinado digitalmente (quando certificado disponível)

          🔐 **Segurança:**
          - Aplicativo assinado com certificado digital (quando disponível)
          - Compatível com Windows Defender SmartScreen
          - Execução segura e confiável

          ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          🏗️ **Workflow:** ${{ github.workflow }}
          "@ | Set-Content -Path release-notes.md -Encoding utf8
          
          # Criar release e fazer upload de todos os arquivos
          gh release create v${{ github.run_number }} release/*.* `
            --title "DashBird Windows Build v${{ github.run_number }}" `
            --notes-file release-notes.md `
            --latest
          
          echo "✅ Release criado com sucesso!"
