name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # 1. BUILD COM ASSINATURA DIGITAL
      - name: Build application artifacts with code signing
        env:
          # Secrets necessários para assinatura de código
          # CSC_LINK: Certificado .pfx codificado em Base64 com prefixo data:application/x-pkcs12;base64,...
          # CSC_KEY_PASSWORD: Senha do certificado
          # CSC_KEY_SHA1: Hash SHA1 do certificado (opcional, mas recomendado)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_KEY_SHA1: ${{ secrets.CSC_KEY_SHA1 }}
          
          # Variáveis de ambiente para build
          NODE_ENV: production
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        shell: pwsh
        run: |
          Write-Host "🔐 Iniciando build com assinatura digital..." -ForegroundColor Green
          Write-Host "📋 Verificando variáveis de ambiente..." -ForegroundColor Yellow
          
          if ($env:CSC_LINK) {
            Write-Host "✅ Certificado configurado" -ForegroundColor Green
          } else {
            Write-Host "⚠️  Certificado não configurado - build sem assinatura" -ForegroundColor Yellow
          }
          
          pnpm run build:windows
          
          Write-Host "✅ Build concluído com sucesso!" -ForegroundColor Green
      
      # 2. VERIFICAÇÃO DOS ARQUIVOS GERADOS
      - name: Verify build artifacts and code signing
        shell: pwsh
        run: |
          Write-Host "🔍 Verificando arquivos gerados..." -ForegroundColor Yellow
          node scripts/verify-build.js
          
          Write-Host "📁 Arquivos gerados em desktop/release:" -ForegroundColor Cyan
          Get-ChildItem release
          
          Write-Host "🔐 Verificando assinatura digital..." -ForegroundColor Yellow
          if (Test-Path "release\*.exe") {
            Get-ChildItem "release\*.exe" | ForEach-Object {
              Write-Host "📋 Verificando: $($_.Name)" -ForegroundColor White
              try {
                $sig = Get-AuthenticodeSignature $_.FullName
                if ($sig.Status -eq "Valid") {
                  Write-Host "✅ $($_.Name) - Assinatura válida" -ForegroundColor Green
                } else {
                  Write-Host "⚠️  $($_.Name) - Status: $($sig.Status)" -ForegroundColor Yellow
                }
              } catch {
                Write-Host "❌ Erro ao verificar assinatura: $_" -ForegroundColor Red
              }
            }
          }

      # 3. CRIAÇÃO E PUBLICAÇÃO DO RELEASE
      - name: Create and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Criar arquivo de notas do release
          @"
          🚀 Build automático do DashBird para Windows

          **Build Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          📦 **Artefatos incluídos:**
          - Instalador NSIS para Windows x64
          - Versão portátil para Windows x64
          - Aplicativo assinado digitalmente (quando certificado disponível)

          🔐 **Segurança:**
          - Aplicativo assinado com certificado digital (quando disponível)
          - Compatível com Windows Defender SmartScreen
          - Execução segura e confiável

          ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          🏗️ **Workflow:** ${{ github.workflow }}
          "@ | Set-Content -Path release-notes.md -Encoding utf8
          
          # Criar release e fazer upload de todos os arquivos
          gh release create v${{ github.run_number }} release/*.* `
            --title "DashBird Windows Build v${{ github.run_number }}" `
            --notes-file release-notes.md `
            --latest
          
          Write-Host "✅ Release criado com sucesso!" -ForegroundColor Green
