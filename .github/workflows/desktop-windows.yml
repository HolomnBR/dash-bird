name: Build Desktop (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. BUILD
      - name: Build app
        run: pnpm run build:windows
      
      - name: Consolidate build
        run: node scripts/consolidate-build.js

      # 2. PREPARE RELEASE
      - name: Prepare release
        shell: pwsh
        run: |
          Write-Host "📦 Preparando release..."
          Write-Host "📁 Diretório atual: $(Get-Location)"
          
          # Listar arquivos para debug
          Write-Host "📁 Conteúdo do diretório atual:"
          Get-ChildItem | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          # Verificar se a pasta release existe
          if (Test-Path "release") {
            Write-Host "📁 Conteúdo da pasta release:"
            Get-ChildItem "release" | ForEach-Object { Write-Host "  - $($_.Name)" }
            
            # Definir caminho do executável para upload
            if (Test-Path "release\Dash Bird.exe") {
              echo "UPLOAD_EXE_PATH=release\Dash Bird.exe" >> $env:GITHUB_ENV
              Write-Host "✅ Dash Bird.exe encontrado: release\Dash Bird.exe"
            } elseif (Test-Path "release\win-unpacked\Dash Bird.exe") {
              echo "UPLOAD_EXE_PATH=release\win-unpacked\Dash Bird.exe" >> $env:GITHUB_ENV
              Write-Host "✅ Dash Bird.exe encontrado: release\win-unpacked\Dash Bird.exe"
            } else {
              Write-Host "❌ Dash Bird.exe não encontrado em lugar nenhum!"
              Write-Host "🔍 Procurando por todos os arquivos .exe:"
              Get-ChildItem "release" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  - $($_.FullName)" }
              exit 1
            }
          } else {
            Write-Host "❌ Pasta release não encontrada!"
            exit 1
          }

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: DashBird Windows Build v${{ github.run_number }}
          body: |
            🚀 Build automático do DashBird para Windows
            
            **Build Number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            📦 **Artefatos incluídos:**
            - Executável principal (.exe)
            - Versão portátil (.exe)
            
            ⚡ **Executado em:** ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

      # 3. UPLOAD
      - name: Upload DashBird Executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.UPLOAD_EXE_PATH }}
          asset_name: DashBird-Windows-v${{ github.run_number }}.exe
          asset_content_type: application/octet-stream

