name: Create Public Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: '🚀 Build automático do DashBird para Windows'

jobs:
  create-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build API
        working-directory: desktop
        run: pnpm run build:api

      - name: Build Electron
        working-directory: desktop
        run: pnpm run build:electron

      - name: Build Windows artifacts
        working-directory: desktop
        run: pnpm run build:windows

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          release_name: DashBird Windows v${{ github.event.inputs.version }}
          body: |
            ${{ github.event.inputs.release_notes }}
            
            **Version:** ${{ github.event.inputs.version }}
            **Build Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            📦 **Downloads disponíveis:**
            - Instalador Windows (.exe)
            - Versão portátil (.exe)
          draft: false
          prerelease: false

      - name: Upload Windows Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: desktop/release/*.exe
          asset_name: DashBird-Windows-v${{ github.event.inputs.version }}.exe
          asset_content_type: application/octet-stream

      - name: Upload Portable Version
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: desktop/release/*.exe
          asset_name: DashBird-Windows-Portable-v${{ github.event.inputs.version }}.exe
          asset_content_type: application/octet-stream

      - name: Upload ZIP Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: desktop/release/*.zip
          asset_name: DashBird-Windows-v${{ github.event.inputs.version }}.zip
          asset_content_type: application/zip
