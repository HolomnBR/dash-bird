name: Test Build (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Test PowerShell Commands
        shell: pwsh
        run: |
          Write-Host "🧪 Testando comandos PowerShell..." -ForegroundColor Green
          
          # Teste de variáveis de ambiente
          $testVar = "teste"
          if ($testVar) {
            Write-Host "✅ Variável definida: $testVar" -ForegroundColor Green
          } else {
            Write-Host "❌ Variável não definida" -ForegroundColor Red
          }
          
          # Teste de comandos básicos
          Write-Host "📁 Diretório atual:" -ForegroundColor Cyan
          Get-Location
          
          Write-Host "📋 Arquivos no diretório:" -ForegroundColor Cyan
          Get-ChildItem | Select-Object -First 5
          
          Write-Host "✅ Todos os testes passaram!" -ForegroundColor Green
