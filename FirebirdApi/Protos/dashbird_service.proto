syntax = "proto3";

option csharp_namespace = "FirebirdApi.Protos";

package dashbird;

// Serviço gRPC para operações Firebird
service DashBirdService {
  // Testar conexão
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  
  // Executar query SELECT
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);
  
  // Executar comando DML/DDL
  rpc ExecuteNonQuery(ExecuteNonQueryRequest) returns (ExecuteNonQueryResponse);
  
  // Executar escalar
  rpc ExecuteScalar(ExecuteScalarRequest) returns (ExecuteScalarResponse);
  
  // Obter informações das tabelas
  rpc GetTables(GetTablesRequest) returns (GetTablesResponse);
  
  // Obter informações de uma tabela específica
  rpc GetTableInfo(GetTableInfoRequest) returns (GetTableInfoResponse);
}

// Serviço gRPC para registro e gerenciamento de nós
service NodeRegistrationService {
  // Registrar nó desktop (funciona para autenticado e anônimo)
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  
  // Iniciar sincronização inicial
  rpc StartInitialSync(StartInitialSyncRequest) returns (StartInitialSyncResponse);
  
  // Enviar lote de dados para sincronização
  rpc SendSyncBatch(SendSyncBatchRequest) returns (SendSyncBatchResponse);
  
  // Completar sincronização inicial
  rpc CompleteInitialSync(CompleteInitialSyncRequest) returns (CompleteInitialSyncResponse);
  
  // Sincronizar databases com o servidor cloud
  rpc SyncDatabases(SyncDatabasesRequest) returns (SyncDatabasesResponse);
  
  // Buscar dados não sincronizados
  rpc PullData(PullDataRequest) returns (PullDataResponse);
  
  // Vincular nó anônimo a um usuário autenticado
  rpc LinkNodeToUser(LinkNodeToUserRequest) returns (LinkNodeToUserResponse);
}

// Mensagens de requisição
message TestConnectionRequest {
  string database_id = 1;
}

message ExecuteQueryRequest {
  string query = 1;
  string database_id = 2;
}

message ExecuteNonQueryRequest {
  string query = 1;
  string database_id = 2;
}

message ExecuteScalarRequest {
  string query = 1;
  string database_id = 2;
}

message GetTablesRequest {
  string database_id = 1;
}

message GetTableInfoRequest {
  string table_name = 1;
  string database_id = 2;
}

// Mensagens para registro de nós
message RegisterNodeRequest {
  string name = 1;
  string machine_id = 2;
  string ip_address = 3;
  int32 port = 4;
  string database_path = 5;
  string version = 6;
  string operating_system = 7;
  string auth_token = 8;
}



message StartInitialSyncRequest {
  string desktop_node_id = 1;
  string database_id = 2;
}

message SendSyncBatchRequest {
  string desktop_node_id = 1;
  string database_id = 2;
  repeated SyncDataItem data_batch = 3;
}

message CompleteInitialSyncRequest {
  string operation_id = 1;
  bool success = 2;
  string error_message = 3;
}

message SyncDatabasesRequest {
  string desktop_node_id = 1;
}

message PullDataRequest {
  string desktop_node_id = 1;
  string database_id = 2;
  int64 last_sync_timestamp = 3;
}

message LinkNodeToUserRequest {
  string node_id = 1;
  string auth_token = 2;
}

// Mensagens de resposta
message TestConnectionResponse {
  bool success = 1;
  string message = 2;
  string database_id = 3;
}

message ExecuteQueryResponse {
  bool success = 1;
  string message = 2;
  repeated QueryRow data = 3;
  string database_id = 4;
}

message ExecuteNonQueryResponse {
  bool success = 1;
  string message = 2;
  int32 rows_affected = 3;
  string database_id = 4;
}

message ExecuteScalarResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  string database_id = 4;
}

message GetTablesResponse {
  bool success = 1;
  string message = 2;
  repeated string table_names = 3;
  string database_id = 4;
}

message GetTableInfoResponse {
  bool success = 1;
  string message = 2;
  TableInfo table_info = 3;
  string database_id = 4;
}

// Mensagens de resposta para registro de nós
message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
  string access_token = 4;
  int64 expires_at = 5;
}



message StartInitialSyncResponse {
  bool success = 1;
  string message = 2;
  string operation_id = 3;
}

message SendSyncBatchResponse {
  bool success = 1;
  string message = 2;
  int32 items_processed = 3;
}

message CompleteInitialSyncResponse {
  bool success = 1;
  string message = 2;
}

message SyncDatabasesResponse {
  bool success = 1;
  string message = 2;
  repeated DatabaseSyncResult results = 3;
}

message PullDataResponse {
  bool success = 1;
  string message = 2;
  repeated SyncDataItem data = 3;
  int64 last_sync_timestamp = 4;
}

message LinkNodeToUserResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
  string user_id = 4;
}

// Estruturas de dados
message QueryRow {
  map<string, string> columns = 1;
}

message TableInfo {
  string table_name = 1;
  string schema = 2;
  repeated ColumnInfo columns = 3;
}

message ColumnInfo {
  string column_name = 1;
  string data_type = 2;
  bool is_nullable = 3;
  int32 max_length = 4;
  bool is_primary_key = 5;
}

// Estruturas para sincronização
message SyncDataItem {
  string table_name = 1;
  string data = 2; // JSON serializado
}

message DatabaseSyncResult {
  string database_id = 1;
  string name = 2;
  string status = 3;
  string error = 4;
}
